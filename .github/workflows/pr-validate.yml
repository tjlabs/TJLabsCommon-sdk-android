name: PR Validate

on:
  pull_request:
    branches:
      - main
      - 'release/*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (debug/release)
        run: ./gradlew :sdk:testDebugUnitTest :sdk:testReleaseUnitTest --stacktrace --no-daemon

      - name: Publish check
        run: ./gradlew :sdk:publishToMavenLocal -x test --stacktrace --no-daemon
